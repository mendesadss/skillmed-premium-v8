    <rect x="7" y="7" width="206" height="76" rx="9" fill="none" stroke="#fff" stroke-opacity=".7"/>
    <text x="110" y="54" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="17" letter-spacing="3" fill="#4a5560">PEDRO H.</text>
  </g>
