    <path d="M22 36h120M22 58h146M22 80h96" stroke="#c9d3de" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 92c-6-8-18-2-12 8l12 10 12-10c6-10-6-16-12-8z" fill="#0b8a3e"/>
