<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Kit SkillMed embalado para presente</title>
  <desc id="d">Caixa de presente com laço, estojo inox gravado ao lado e cartão com mensagem.</desc>
  <defs>
    <linearGradient id="aco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset=".45" stop-color="#c9d0d6"/><stop offset=".58" stop-color="#eceff2"/><stop offset="1" stop-color="#b3bbc3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="28" fill="#e8f1fb"/>
  <!-- caixa -->
  <rect x="70" y="150" width="250" height="190" rx="12" fill="#0b1b2e"/>
  <rect x="56" y="120" width="278" height="56" rx="10" fill="#13263d"/>
  <rect x="182" y="120" width="26" height="220" fill="#1565c0"/>
  <path d="M195 120c-30-40-80-40-70-10s50 12 70 10zm0 0c30-40 80-40 70-10s-50 12-70 10z" fill="#1565c0"/>
